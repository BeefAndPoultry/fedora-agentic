[Storage]
default_scheme = BTRFS
default_partitioning =
    / (btrfs)
    /home (btrfs)
    /swap (btrfs)
    /var/cache (btrfs)
    /var/log (btrfs)
    /var/tmp (btrfs)
    /var/lib/flatpak (btrfs)
    /var/lib/containers (btrfs)

