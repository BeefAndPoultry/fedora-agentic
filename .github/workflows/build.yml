name: Build Custom Fedora ISO

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-config:
    # Verify that every configuration file (XML/YAML/TOML) is well-formed
    # before the expensive ISO build runs. Lightweight: no privileged container.
    name: Validate repository config files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Run integrity check
        run: python3 scripts/check_file_integrity.py

  build-iso:
    # Only run after validate-config passes; GitHub Actions skips a job whenever
    # any job it `needs` failed, so a corrupted config never triggers an expensive build.
    needs: validate-config
    runs-on: ubuntu-latest
    container:
      # GitHub runners run Ubuntu, so launch a privileged fedora:latest container.
      # KIWI needs loop devices and must build the squashfs filesystem itself.
      image: fedora:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KIWI and build dependencies
        run: |
          dnf install -y kiwi kiwi-systemdeps distribution-gpg-keys git

      - name: Build Live ISO
        run: |
          mkdir -p outdir
          ./kiwi-build \
            --kiwi-file=Fedora.kiwi \
            --image-type=iso \
            --image-profile=KDE-Desktop-Live \
            --image-release=0 \
            --output-dir=./outdir

      - name: Report largest packages in image
        # config.sh writes this file on the image rootfs before the chroot exits.
        # kiwi-ng captures config.sh's stdout, so we can't see it directly; instead
        # we extract the assembled rootfs from the built ISO and cat the file build.yml
        # wrote, where GitHub Actions actually captures stdout. Runs before the size
        # check so the diagnosis is even available when the ISO trips the 2 GB limit
        # (issues #6/#23/#24). Needs a privileged container: loopback-mounting an ISO
        # requires loop devices, which the --privileged fedora:latest container provides.
        run: |
          set -euxo pipefail
          dnf install -y squashfs-tools

          ISO_FILE=$(find ./outdir -name "*.iso" | head -n 1)
          if [ ! -f "$ISO_FILE" ]; then
            echo "No ISO found under outdir; skipping package report" >&2
            exit 0
          fi
          echo "Built ISO file: $ISO_FILE"

          mkdir -p /tmp/mntsrc /tmp/rootfs
          # Mount the ISO read-only to reach the squashfs holding the root.
          mount -o loop,ro "$ISO_FILE" /tmp/mntsrc || true

          # The t2linux/KIWI live ISO stores the root filesystem as a squashfs
          # image somewhere on the ISO. Pick the largest one (the root is by far
          # the heaviest).
          find /tmp/mntsrc -name '*'
          SQ=$(find /tmp/mntsrc -name '*.squashfs' -printf '%s %p\n' 2>/dev/null | sort -rn | head -n1 | awk '{print $2}')
          if [ -n "$SQ" ]; then
            echo "Extracting rootfs squashfs: $SQ"
            unsquashfs -d /tmp/rootfs "$SQ" || true
          fi

          # config.sh wrote this on the image rootfs; cat it so GitHub Actions
          # captures its output. Skip gracefully if the squashfs didn't extract.
          if [ -f /tmp/rootfs/var/log/largest-packages.txt ]; then
            echo "=== TOP 30 LARGEST PACKAGES IN IMAGE ==="
            cat /tmp/rootfs/var/log/largest-packages.txt
          else
            echo "Could not locate the package report in the extracted rootfs; skipping package report" >&2
          fi

          umount /tmp/mntsrc 2>/dev/null || true
          umount /tmp/mntsrc 2>/dev/null || true

      - name: Verify ISO is under 2GB
        run: |
          ISO_FILE=$(find ./outdir -name "*.iso" | head -n 1)
          echo "Built ISO file: $ISO_FILE"
          ISO_SIZE=$(stat -c%s "$ISO_FILE")
          echo "Built ISO size: $((ISO_SIZE / 1024 / 1024)) MB"
          if [ "$ISO_SIZE" -ge 2147483648 ]; then
            echo "Error: ISO exceeds GitHub Releases 2GB limit!"
            exit 1
          fi

      - name: Upload to GitHub Releases
        # Only publish a release on pushes to main; never on pull requests.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: outdir/*
