name: Build Custom Fedora ISO

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate-config:
    # Verify that every configuration file (XML/YAML/TOML) is well-formed
    # before the expensive ISO build runs. Lightweight: no privileged container.
    name: Validate repository config files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Run integrity check
        run: python3 scripts/check_file_integrity.py

  build-iso:
    # Only run after validate-config passes; GitHub Actions skips a job whenever
    # any job it `needs` failed, so a corrupted config never triggers an expensive build.
    needs: validate-config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      # GitHub runners run Ubuntu, so launch a privileged fedora:latest container.
      # KIWI needs loop devices and must build the squashfs filesystem itself.
      image: fedora:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install KIWI and build dependencies
        run: |
          dnf install -y kiwi kiwi-systemdeps distribution-gpg-keys git zip

      - name: Build ksystemstats llama.cpp plugin
        # Compile the native sensor plugin from source, then copy the .so +
        # metadata.json into the image overlay so KIWI bakes them into the ISO.
        # See plugins/ksystemstats-llamacpp/README.md and issue #41.
        run: |
          set -euo pipefail
          # Build runs in plugins/ksystemstats-llamacpp/build/, a subdirectory of
          # the checkout. CMake's VCS probe stops at the container mount boundary
          # and bails out ("not a git repository"); allow it to cross filesystems
          # so git finds the repo root, eliminating those fatal messages.
          export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
          # Install via CMake "Provides" specs (cmake(KF6CoreAddons), etc.) so we
          # are immune to KF6 dev-package name drift, e.g. kf6-kcoreaddons-devel
          # vs the older kf6-coreaddons-devel. libksysguard-devel pulls in
          # kf6-ki18n-devel as a dependency.
          dnf install -y gcc-c++ extra-cmake-modules qt6-qtbase-devel cmake \
            'cmake(Qt6Core)' 'cmake(Qt6Network)' \
            'cmake(KF6CoreAddons)' 'cmake(KF6I18n)' \
            libksysguard-devel

          mkdir -p plugins/ksystemstats-llamacpp/build
          cd plugins/ksystemstats-llamacpp/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j

          # The plugin target's *install* destination (KDEInstallDirs) is
          # lib64/qt6/plugins/ksystemstats, but its location in the build tree is
          # not reliable — so stage-install into a local prefix and copy from there.
          PREFIX=$(pwd)/stage
          cmake --install . --prefix "$PREFIX"

          DEST=root/usr/lib64/qt6/plugins/ksystemstats
          mkdir -p "$DEST"
          SO=$(find "$PREFIX" -name 'libksystemstats_plugin_llamacpp.so' | head -n 1)
          if [ -z "$SO" ]; then
            echo "ERROR: plugin .so not found after install" >&2
            exit 1
          fi
          install -m0755 "$SO" "$DEST/"
          install -m0644 ../metadata.json "$DEST/"
          rm -rf "$PREFIX"

      - name: Build Live ISO
        run: |
          mkdir -p outdir
          ./kiwi-build \
            --kiwi-file=Fedora.kiwi \
            --image-type=iso \
            --image-profile=KDE-Agentic-Live \
            --image-release=0 \
            --output-dir=./outdir

      - name: Report largest packages in image
        run: |
          if [ -f ./outdir-build/build/image-root/var/log/largest-packages.txt ]; then
            echo "=== LARGEST PACKAGES IN IMAGE ==="
            cat ./outdir-build/build/image-root/var/log/largest-packages.txt
          elif [ -d ./outdir-build/build/image-root ]; then
            echo "=== LARGEST PACKAGES IN IMAGE (via rpm --root) ==="
            rpm --root="$(realpath ./outdir-build/build/image-root)" \
              -qa --qf '%{SIZE}\t%{NAME}\n' | sort -rn | head -n 50 | \
              awk '{printf "%.1f MB\t%s\n", $1/1024/1024, $2}'
          else
            echo "image-root not found under ./outdir-build/build/image-root" >&2
          fi

      - name: Verify ISO file size
        run: |
          ISO_FILE=$(find ./outdir -name "*.iso" | head -n 1)
          ISO_SIZE=$(stat -c%s "$ISO_FILE")
          echo "Built ISO $ISO_FILE size: $((ISO_SIZE / 1024 / 1024)) MB"
          if [ "$ISO_SIZE" -ge 2147483648 ]; then
            echo "Error: ISO exceeds GitHub Releases 2GB limit!"
            exit 1
          fi


      - name: Verify required packages are included
        # The agentic desktop ships these packages; catch a missing one before the
        # expensive ISO build is relied upon downstream. Extend this list as needed.
        run: |
          set -euo pipefail
          PACKAGES_FILE=$(find ./outdir -maxdepth 1 -name "*.packages" | head -n 1)
          if [ -z "$PACKAGES_FILE" ]; then
            echo "ERROR: no *.packages manifest found under ./outdir" >&2
            exit 1
          fi
          REQUIRED_PACKAGES=(
            iwlwifi-mld-firmware
          )
          for pkg in "${REQUIRED_PACKAGES[@]}"; do
            if grep -q "$pkg" "$PACKAGES_FILE"; then
              echo "SUCCESS: $pkg is present in $PACKAGES_FILE"
            else
              echo "ERROR: $pkg missing from $PACKAGES_FILE" >&2
              exit 1
            fi
          done

      - name: Verify libraries are linked by ldconfig
        # The agentic desktop ships a Vulkan llama.cpp build; ensure the ggml
        # Vulkan plugin library is registered so GPU acceleration resolves at runtime.
        # Extend REQUIRED_LIBS to check additional shared libraries in the image root.
        run: |
          set -euo pipefail
          IMAGE_ROOT=$(realpath ./outdir-build/build/image-root)
          if [ ! -d "$IMAGE_ROOT" ]; then
            echo "ERROR: image root not found at $IMAGE_ROOT" >&2
            exit 1
          fi
          REQUIRED_LIBS=(
          )
          for lib in "${REQUIRED_LIBS[@]}"; do
            if ldconfig -p -r "$IMAGE_ROOT" | grep -q "$lib"; then
              echo "SUCCESS: $lib is registered in ldconfig cache"
            else
              echo "ERROR: $lib missing from ldconfig cache" >&2
              exit 1
            fi
          done

      - name: Verify ksystemstats llama.cpp plugin shipped in image
        # The native sensor plugin (.so + metadata.json) is built from source
        # and copied into the root overlay, so confirm it reached both the build
        # image-root AND the final ISO before this step runs.
        run: |
          set -euo pipefail
          IMAGE_ROOT=$(realpath ./outdir-build/build/image-root)
          SO="$IMAGE_ROOT/usr/lib64/qt6/plugins/ksystemstats/libksystemstats_plugin_llamacpp.so"
          if [ ! -f "$SO" ]; then
            echo "ERROR: ksystemstats llama.cpp plugin .so not in image root: $SO" >&2
            exit 1
          fi
          ISO_FILE=$(find ./outdir -name "*.iso" | head -n 1)
          mkdir -p /tmp/ksplugin-mount
          xorriso -indev "$ISO_FILE" -osirrox on -extract /usr/lib64/qt6/plugins/ksystemstats \
            /tmp/ksplugin-mount || {
            echo "ERROR: could not extract ksystemstats dir from $ISO_FILE" >&2
            exit 1
          }
          if [ ! -f /tmp/ksplugin-mount/libksystemstats_plugin_llamacpp.so ]; then
            echo "ERROR: .so missing inside ISO: $ISO_FILE" >&2
            exit 1
          fi
          echo "SUCCESS: ksystemstats llama.cpp plugin present in image root and ISO"

      - name: Test boot ISO in QEMU (UEFI)
        run: |
          set -euo pipefail
          dnf install -y qemu-system-x86-core edk2-ovmf xorriso

          ISO_FILE=$(find ./outdir -name "*.iso" | head -n 1)
          mkdir -p /tmp/isoboot

          osirrox -indev "$ISO_FILE" \
            -extract /boot/x86_64/loader/linux /tmp/isoboot/vmlinuz \
            -extract /boot/x86_64/loader/initrd /tmp/isoboot/initrd.img

          VOLID=$(blkid -s LABEL -o value "$ISO_FILE")
          echo "Testing ISO: $ISO_FILE (VOLID=$VOLID)"

          ACCEL="-accel tcg"
          [ -e /dev/kvm ] && ACCEL="-accel kvm -cpu host"

          # Boot with 4GB RAM + VirtIO GPU and capture serial console
          timeout 180s qemu-system-x86_64 \
            $ACCEL \
            -m 4096 \
            -smp 2 \
            -vga virtio \
            -bios /usr/share/edk2/ovmf/OVMF_CODE.fd \
            -cdrom "$ISO_FILE" \
            -kernel /tmp/isoboot/vmlinuz \
            -initrd /tmp/isoboot/initrd.img \
            -append "root=live:CDLABEL=${VOLID} rd.live.image console=ttyS0 systemd.unit=graphical.target" \
            -display none \
            -serial stdio \
            -no-reboot | tee /tmp/boot.log || true

          echo "=== CHECKING BOOT LOG ==="
          if grep -q "\[FAILED\]" /tmp/boot.log; then
            echo "ERROR: One or more systemd services failed during boot:"
            grep "\[FAILED\]" /tmp/boot.log
            exit 1
          fi

          if grep -Eq "Reached target.*Graphical Interface|Finished plymouth-quit\.service|localhost-live login:" /tmp/boot.log; then
            echo "SUCCESS: ISO booted cleanly with zero systemd failures!"
          else
            echo "ERROR: Boot timed out before completing startup."
            exit 1
          fi

      - name: Test boot ISO in QEMU (GRUB)
        run: |
          set -euo pipefail
          dnf install -y qemu-system-x86-core edk2-ovmf xorriso

          ISO_FILE=$(find ./outdir -name "*.iso" | head -n 1)
          VOLID=$(blkid -s LABEL -o value "$ISO_FILE")
          echo "Testing ISO: $ISO_FILE (VOLID=$VOLID)"

          ACCEL="-accel tcg"
          [ -e /dev/kvm ] && ACCEL="-accel kvm -cpu host"

          # Boot with 4GB RAM + VirtIO GPU and capture serial console
          timeout 180s qemu-system-x86_64 \
            $ACCEL \
            -m 4096 \
            -smp 2 \
            -vga virtio \
            -bios /usr/share/edk2/ovmf/OVMF_CODE.fd \
            -cdrom "$ISO_FILE" \
            -display none \
            -serial stdio \
            -no-reboot \
          | tee /tmp/boot.log || true

          echo "=== CHECKING BOOT LOG ==="
          if grep -q "\[FAILED\]" /tmp/boot.log; then
            echo "ERROR: One or more systemd services failed during boot:"
            grep "\[FAILED\]" /tmp/boot.log
            exit 1
          fi

          if grep -Eq "Reached target.*Graphical Interface|Finished plymouth-quit\.service|localhost-live login:" /tmp/boot.log; then
            echo "SUCCESS: ISO booted cleanly with zero systemd failures!"
          else
            echo "ERROR: Boot timed out before completing startup."
            exit 1
          fi

      - name: Zip ISO into <2GB parts
        # GitHub Releases caps single-file uploads at 2GB; only split the ISO when
        # it actually exceeds 2GB, so smaller images upload as a single file.
        # zip multi-part archives are reassembled with `unzip -s` or a simple cat
        # of <name>.z0N…<name>.zip + <name>.zip.
        run: |
          set -euo pipefail
          ISO_FILE=$(find ./outdir -name "*.iso" | head -n 1)
          ISO_SIZE=$(stat -c%s "$ISO_FILE")
          # 2 GB threshold (binary GiB), matching the zip part size below.
          THRESHOLD=2147483648
          if [ "$ISO_SIZE" -lt "$THRESHOLD" ]; then
            echo "ISO is $((ISO_SIZE / 1024 / 1024)) MB (<2GB); uploading unsplit."
            exit 0
          fi
          ISO_BASENAME=$(basename "$ISO_FILE" .iso)
          echo "ISO is $((ISO_SIZE / 1024 / 1024)) MB (≥2GB); splitting into ≤1.95GB zip parts"
          zip --version | head -n 1
          # `-s` emits <ISO_BASENAME>.z01, .z02, … and final .zip
          zip -j -0 -s 1950m "./outdir/${ISO_BASENAME}.zip" "$ISO_FILE"
          ls -lh ./outdir
          echo "ISO_BASENAME=$ISO_BASENAME" >> "$GITHUB_ENV"
          rm -f "$ISO_FILE"

      - name: Generate release metadata
        id: meta
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # Sanitize slashes in branch names (e.g., feat/foo -> feat-foo)
          SAFE_BRANCH="${BRANCH//\//-}"
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
          # tag name with 45 for the Fedora base version
          echo "tag=build-45-${TIMESTAMP}-${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
      
      - name: Upload to GitHub Releases
        # If you only want to publish a release on pushes to main; never on pull requests.
        #if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          files: |
            ./outdir/*
